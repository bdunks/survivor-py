<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFL Survivor Pool Optimizer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
  <style>
    :root {
      --user-pick-bg: #004d40;
      /* Dark Teal */
      --user-pick-border: #4db6ac;
      /* Light Teal */
      --suggested-pick-border: #f9a825;
      /* Yellow */
      --disabled-cell-bg: rgba(45, 55, 72, 0.7);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    main.container {
      max-width: 95%;
      padding: 1rem;
    }

    .controls-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      align-items: end;
      margin-bottom: 1.5rem;
    }

    .survivor-grid-container {
      overflow-x: auto;
    }

    .survivor-grid {
      border-collapse: collapse;
      width: 100%;
      table-layout: fixed;
    }

    .survivor-grid th,
    .survivor-grid td {
      border: 1px solid #4a5568;
      padding: 0;
      text-align: center;
      height: 60px;
      min-width: 90px;
    }

    .survivor-grid th {
      background-color: #2d3748;
      font-size: 0.9em;
    }

    .survivor-grid th:first-child {
      /* Team name header */
      min-width: 120px;
      background-color: #1a202c;
      position: sticky;
      left: 0;
      z-index: 10;
    }

    .survivor-grid td:first-child {
      /* Sticky team name column */
      background-color: #1a202c;
      position: sticky;
      left: 0;
      z-index: 10;
      font-weight: bold;
    }

    .grid-cell {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: background-color 0.2s;
      font-size: 0.85em;
    }

    .grid-cell:hover {
      background-color: #4a5568;
    }

    .grid-cell.user-pick {
      background-color: var(--user-pick-bg);
      border: 2px solid var(--user-pick-border);
      color: white;
      cursor: not-allowed;
    }

    .grid-cell.user-pick:hover {
      background-color: var(--user-pick-bg);
    }

    .grid-cell.suggested-pick {
      border: 2px solid var(--suggested-pick-border);
      box-shadow: 0 0 10px var(--suggested-pick-border);
    }

    .grid-cell.disabled {
      background-color: var(--disabled-cell-bg);
      color: #718096;
      cursor: not-allowed;
      pointer-events: none;
    }

    .grid-cell.disabled:hover {
      background-color: var(--disabled-cell-bg);
    }

    .opponent {
      font-weight: bold;
    }

    .spread {
      font-size: 0.9em;
      color: #a0aec0;
    }

    .bye-week {
      background-color: var(--disabled-cell-bg);
      color: #718096;
      font-style: italic;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* Loading states */
    .loading {
      opacity: 0.6;
    }

    /* Export button positioning */
    .export-controls {
      text-align: right;
      margin-bottom: 1rem;
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <h1>NFL Survivor Pool Optimizer</h1>
      <p>Click a cell to lock in a pick. The optimizer will suggest the best path forward based on your choices.</p>
    </header>

    <article class="controls-container">
      <div>
        <label for="yearSelect">Season Year</label>
        <select id="yearSelect">
          <option value="2025">2025</option>
          <option value="2024">2024</option>
          <option value="2023">2023</option>
        </select>
      </div>
      <div>
        <label for="algorithmSelect">Algorithm</label>
        <select id="algorithmSelect">
          <option value="best-spread">Best Spread</option>
          <option value="weighted-future-value">Weighted Future Value</option>
          <option value="back-to-front">Back-to-Front</option>
        </select>
      </div>
      <div>
        <label for="splitWeekSlider">Split Week: <span id="splitWeekValue">10</span></label>
        <input type="range" min="1" max="18" value="10" id="splitWeekSlider">
      </div>
      <div>
        <button id="refreshDataBtn" aria-busy="false">Refresh Data</button>
        <button id="resetBtn" class="secondary outline">Reset Picks</button>
      </div>
    </article>

    <div class="export-controls">
      <button id="exportCsvBtn" class="outline">Export to CSV</button>
    </div>

    <div class="survivor-grid-container">
      <table class="survivor-grid" id="survivorGrid">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // --- DOM ELEMENTS ---
      const survivorGridHead = document.querySelector('#survivorGrid thead');
      const survivorGridBody = document.querySelector('#survivorGrid tbody');
      const splitWeekSlider = document.getElementById('splitWeekSlider');
      const splitWeekValue = document.getElementById('splitWeekValue');
      const algorithmSelect = document.getElementById('algorithmSelect');
      const refreshDataBtn = document.getElementById('refreshDataBtn');
      const resetBtn = document.getElementById('resetBtn');
      const yearSelect = document.getElementById('yearSelect');
      const exportCsvBtn = document.getElementById('exportCsvBtn');

      // --- CONSTANTS & STATE ---
      const NFL_TEAMS = ["ARI", "ATL", "BAL", "BUF", "CAR", "CHI", "CIN", "CLE", "DAL", "DEN", "DET", "GB", "HOU", "IND", "JAX", "KC", "LV", "LAC", "LAR", "MIA", "MIN", "NE", "NO", "NYG", "NYJ", "PHI", "PIT", "SF", "SEA", "TB", "TEN", "WAS"];
      const WEEKS = 18;

      let scheduleData = {}; // To hold the full season schedule
      let userPicks = {}; // { week: team, ... }
      let currentConfig = null;

      // --- API FUNCTIONS ---
      async function fetchConfig() {
        try {
          const response = await fetch('/api/config');
          if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          return await response.json();
        } catch (error) {
          showError(`Failed to load configuration: ${error.message}`);
          return null;
        }
      }

      async function fetchEvents(year) {
        try {
          const response = await fetch(`/api/data/events?year=${year}`);
          if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          return await response.json();
        } catch (error) {
          showError(`Failed to load events: ${error.message}`);
          return [];
        }
      }

      async function updatePick(team, week) {
        try {
          const response = await fetch('/api/config/picks', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              team: team,
              week: week,
              spread: null
            })
          });
          
          if (!response.ok) {
            const error = await response.json();
            throw new Error(error.detail || 'Failed to update pick');
          }
          
          showSuccess(`Added pick: ${team} for week ${week}`);
          return await response.json();
        } catch (error) {
          showError(`Failed to update pick: ${error.message}`);
          return null;
        }
      }

      async function clearPick(week) {
        try {
          const response = await fetch(`/api/config/picks/${week}`, {
            method: 'DELETE'
          });
          
          if (!response.ok) {
            const error = await response.json();
            throw new Error(error.detail || 'Failed to clear pick');
          }
          
          showSuccess(`Cleared pick for week ${week}`);
          return await response.json();
        } catch (error) {
          showError(`Failed to clear pick: ${error.message}`);
          return null;
        }
      }

      async function refreshData() {
        const year = parseInt(yearSelect.value);
        try {
          refreshDataBtn.setAttribute('aria-busy', 'true');
          refreshDataBtn.textContent = 'Refreshing...';
          
          const response = await fetch(`/api/data/refresh?year=${year}`, {
            method: 'POST'
          });
          
          if (!response.ok) {
            const error = await response.json();
            throw new Error(error.detail || 'Failed to refresh data');
          }
          
          const result = await response.json();
          showSuccess(`Refreshed ${result.events_count} events for ${result.year}`);
          
          // Refresh schedule data and grid after data update
          await loadScheduleData();
          renderGrid();
          await runOptimization();
          
        } catch (error) {
          showError(`Failed to refresh data: ${error.message}`);
        } finally {
          refreshDataBtn.setAttribute('aria-busy', 'false');
          refreshDataBtn.textContent = 'Refresh Data';
        }
      }

      async function getOptimization(splitWeek, algorithm) {
        const year = parseInt(yearSelect.value);
        try {
          const response = await fetch(`/api/optimize/${splitWeek}/${algorithm}?year=${year}`);
          if (!response.ok) {
            const error = await response.json();
            throw new Error(error.detail || 'Failed to get optimization');
          }
          return await response.json();
        } catch (error) {
          showError(`Failed to get optimization: ${error.message}`);
          return null;
        }
      }

      async function exportToCsv() {
        const splitWeek = parseInt(splitWeekSlider.value);
        const year = parseInt(yearSelect.value);
        const algorithm = algorithmSelect.value;
        
        try {
          exportCsvBtn.setAttribute('aria-busy', 'true');
          exportCsvBtn.textContent = 'Exporting...';
          
          const response = await fetch(`/api/export/csv?split_week=${splitWeek}&algorithm=${algorithm}&year=${year}`);
          
          if (!response.ok) {
            const error = await response.json();
            throw new Error(error.detail || 'Failed to export CSV');
          }
          
          // Create download
          const blob = await response.blob();
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.style.display = 'none';
          a.href = url;
          a.download = `survivor_picks_${year}_week${splitWeek}_${algorithm}.csv`;
          document.body.appendChild(a);
          a.click();
          window.URL.revokeObjectURL(url);
          document.body.removeChild(a);
          
          showSuccess('CSV file downloaded successfully');
          
        } catch (error) {
          showError(`Failed to export CSV: ${error.message}`);
        } finally {
          exportCsvBtn.setAttribute('aria-busy', 'false');
          exportCsvBtn.textContent = 'Export to CSV';
        }
      }

      // --- UTILITY FUNCTIONS ---
      function showError(message) {
        console.error(message);
        alert(`Error: ${message}`);
      }

      function showSuccess(message) {
        console.log(message);
      }

      // --- DATA PROCESSING ---
      async function loadScheduleData() {
        const year = parseInt(yearSelect.value);
        const events = await fetchEvents(year);
        
        // Convert events to schedule data format
        scheduleData = {};
        NFL_TEAMS.forEach(team => {
          scheduleData[team] = {};
        });

        events.forEach(event => {
          const homeTeam = event.home_team;
          const awayTeam = event.away_team;
          const week = event.week;
          const spread = event.spread;
          const favoredTeam = event.favored_team;

          // Add game for home team
          if (scheduleData[homeTeam]) {
            scheduleData[homeTeam][week] = {
              opponent: `vs ${awayTeam}`,
              spread: homeTeam === favoredTeam ? Math.abs(spread) : -Math.abs(spread),
              isFavored: homeTeam === favoredTeam
            };
          }

          // Add game for away team
          if (scheduleData[awayTeam]) {
            scheduleData[awayTeam][week] = {
              opponent: `@ ${homeTeam}`,
              spread: awayTeam === favoredTeam ? Math.abs(spread) : -Math.abs(spread),
              isFavored: awayTeam === favoredTeam
            };
          }
        });
      }

      // --- GRID RENDERING ---
      function renderGrid() {
        // Header
        let headerHtml = '<tr><th>Team</th>';
        for (let i = 1; i <= WEEKS; i++) headerHtml += `<th>Week ${i}</th>`;
        headerHtml += '</tr>';
        survivorGridHead.innerHTML = headerHtml;

        // Body
        let bodyHtml = '';
        NFL_TEAMS.forEach(team => {
          bodyHtml += `<tr><td>${team}</td>`;
          for (let week = 1; week <= WEEKS; week++) {
            const game = scheduleData[team]?.[week];
            if (game) {
              const spreadDisplay = game.spread > 0 ? `+${game.spread.toFixed(1)}` : game.spread.toFixed(1);
              bodyHtml += `
                <td data-team="${team}" data-week="${week}">
                  <div class="grid-cell">
                    <span class="opponent">${game.opponent}</span>
                    <span class="spread">${spreadDisplay}</span>
                  </div>
                </td>`;
            } else {
              bodyHtml += `<td><div class="grid-cell bye-week">BYE</div></td>`;
            }
          }
          bodyHtml += '</tr>';
        });
        survivorGridBody.innerHTML = bodyHtml;
        addGridEventListeners();
        updateGridState();
      }

      function updateGridState() {
        // Convert user picks to week->team format
        const pickedTeams = new Set();
        const pickedWeeks = new Set();
        const weekToTeam = {};

        if (currentConfig && currentConfig.user_picks) {
          currentConfig.user_picks.forEach(pick => {
            pickedTeams.add(pick.team);
            pickedWeeks.add(pick.week);
            weekToTeam[pick.week] = pick.team;
          });
        }

        userPicks = weekToTeam;

        // Update grid cell states
        document.querySelectorAll('.grid-cell').forEach(cell => {
          if (cell.classList.contains('bye-week')) return;

          cell.classList.remove('user-pick', 'disabled', 'suggested-pick');
          const week = parseInt(cell.parentElement.dataset.week);
          const team = cell.parentElement.dataset.team;

          if (weekToTeam[week] === team) {
            cell.classList.add('user-pick');
          } else if (pickedTeams.has(team) || pickedWeeks.has(week)) {
            cell.classList.add('disabled');
          }
        });

        runOptimization();
      }

      // --- OPTIMIZATION & SUGGESTIONS ---
      async function runOptimization() {
        const splitWeek = parseInt(splitWeekSlider.value);
        const algorithm = algorithmSelect.value;
        
        try {
          // Clear previous suggestions
          document.querySelectorAll('.suggested-pick').forEach(cell => {
            cell.classList.remove('suggested-pick');
          });

          const optimizationData = await getOptimization(splitWeek, algorithm);
          if (optimizationData && optimizationData.picks) {
            renderOptimizerSuggestions(optimizationData.picks);
          }
        } catch (error) {
          console.error('Failed to run optimization:', error);
        }
      }

      function renderOptimizerSuggestions(picks) {
        picks.forEach(pick => {
          const cell = document.querySelector(`td[data-team="${pick.team}"][data-week="${pick.week}"] .grid-cell`);
          if (cell && !cell.classList.contains('user-pick') && !cell.classList.contains('disabled')) {
            cell.classList.add('suggested-pick');
          }
        });
      }

      // --- EVENT LISTENERS ---
      async function handleCellClick(e) {
        const cellElement = e.currentTarget.parentElement;
        const team = cellElement.dataset.team;
        const week = parseInt(cellElement.dataset.week);
        const gridCell = e.currentTarget;

        if (gridCell.classList.contains('bye-week') || gridCell.classList.contains('disabled')) {
          return;
        }

        if (gridCell.classList.contains('user-pick')) {
          // Un-picking
          await clearPick(week);
        } else {
          // Picking
          await updatePick(team, week);
        }
        
        // Refresh config and grid state
        currentConfig = await fetchConfig();
        updateGridState();
      }

      function addGridEventListeners() {
        document.querySelectorAll('.grid-cell').forEach(cell => {
          cell.addEventListener('click', handleCellClick);
        });
      }

      // Control event listeners
      splitWeekSlider.addEventListener('input', (e) => {
        splitWeekValue.textContent = e.target.value;
      });

      splitWeekSlider.addEventListener('change', runOptimization);
      algorithmSelect.addEventListener('change', runOptimization);
      yearSelect.addEventListener('change', async () => {
        await loadScheduleData();
        renderGrid();
      });

      resetBtn.addEventListener('click', async () => {
        if (confirm('Are you sure you want to reset all picks?')) {
          // Clear all picks
          const picks = Object.keys(userPicks);
          for (const week of picks) {
            await clearPick(parseInt(week));
          }
          currentConfig = await fetchConfig();
          updateGridState();
        }
      });

      refreshDataBtn.addEventListener('click', refreshData);
      exportCsvBtn.addEventListener('click', exportToCsv);

      // --- INITIALIZATION ---
      async function init() {
        try {
          // Load current configuration
          currentConfig = await fetchConfig();
          
          // Load schedule data
          await loadScheduleData();
          
          // Render grid
          renderGrid();
          
        } catch (error) {
          showError(`Failed to initialize application: ${error.message}`);
        }
      }

      init();
    });
  </script>
</body>

</html>
