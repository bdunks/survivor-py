[tools]
uv = "latest"
ruff = "0.16.6"

[settings]
python.uv_venv_auto = true

[tasks.dev]
run = "uv run uvicorn app:app --reload --host 127.0.0.1 --port 8000"

[tasks.lint]
run = "ruff check ."

[tasks.format]
run = "ruff format ."

[tasks.format-check]
run = "ruff format --check ."

[tasks.test]
run = "uv run python -m unittest discover -v"

[tasks.check]
depends = ["lint", "format-check", "test"]
